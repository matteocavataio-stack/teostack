<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Gradiente Certificazione / Checksum -->
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    
    <!-- Gradiente Strati Stack -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#141b2d"/><stop offset="100%" stop-color="#0b0f19"/></linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g transform="translate(512,512) scale(0.8) translate(-512,-512)">
  <g transform="translate(32,-48) scale(8)">
    <!-- Scheda Base dello Stack (Ombra) -->
    <path d="M15 85 L75 110 L105 95 L45 70 Z" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
    
    <!-- Scheda Centrale dello Stack -->
    <path d="M15 65 L75 90 L105 75 L45 50 Z" fill="url(#cardGrad)" stroke="#475569" stroke-width="2" />
    
    <!-- Scheda Superiore (Master Card Cinema) -->
    <path d="M15 45 L75 70 L105 55 L45 30 Z" fill="#1E293B" stroke="#64748B" stroke-width="2" />
    
    <!-- Pin di connessione / Connettori Hardware -->
    <path d="M50 33 L60 37 M63 38 L73 42 M76 43 L86 47" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />

    <!-- Perforazioni pellicola 35mm proiettate sul bordo -->
    <rect x="23" y="52" width="6" height="4" rx="1" fill="#94A3B8" transform="skewY(22)" />
    <rect x="33" y="56" width="6" height="4" rx="1" fill="#94A3B8" transform="skewY(22)" />
    <rect x="43" y="60" width="6" height="4" rx="1" fill="#94A3B8" transform="skewY(22)" />

    <!-- Sigillo di Verifica / Ala "X" di Certificazione -->
    <path d="M30 68 L52 92 L102 32" fill="none" stroke="url(#glow)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Secondo braccio sottile che chiude la X di "Xt" in prospettiva -->
    <path d="M78 88 L98 62" fill="none" stroke="#00F2FE" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  </g>

  
  </g>
</svg>
