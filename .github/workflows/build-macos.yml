name: Build macOS installer

on:
  push:
    branches: ["claude/**", "main"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Se compilato (es. v1.0.0) pubblica anche una Release con dmg e pkg"
        required: false
        default: ""
      runner:
        description: "Tipo di Mac di GitHub (macos-15 di serie; macos-14 se la coda di macos-15 è lunga)"
        required: false
        default: "macos-15"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    steps:
      - uses: actions/checkout@v4
      - name: Versione Swift
        run: swift --version
      - name: Test (nucleo)
        continue-on-error: true
        run: swift test 2>&1 | tail -40
      - name: App + installer
        run: packaging/build-installer.sh
      - name: Contenuto app
        run: |
          ls -R dist/TeoStackXt.app/Contents | head -60
          file dist/TeoStackXt.app/Contents/MacOS/TeoStackXt
      - uses: actions/upload-artifact@v4
        with:
          name: TeoStackXt-installer
          path: |
            dist/*.pkg
            dist/*.dmg
          if-no-files-found: error
      - name: Pubblica release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release_tag }}" dist/*.dmg dist/*.pkg --target "${{ github.sha }}" \
            --title "TeoStackXt ${{ inputs.release_tag }}" \
            --notes "App macOS universale (Intel + Apple Silicon). .dmg: versione portatile (trascina TeoStackXt.app dove vuoi). .pkg: installer. Primo avvio: clic destro sull'app, poi Apri."
