name: Build macOS installer

on:
  push:
    branches: ["claude/**", "main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Versione Swift
        run: swift --version
      - name: Test (nucleo)
        continue-on-error: true
        run: swift test 2>&1 | tail -40
      - name: App + installer
        run: packaging/build-installer.sh
      - name: Contenuto app
        run: |
          ls -R dist/TeoStackXt.app/Contents | head -60
          file dist/TeoStackXt.app/Contents/MacOS/TeoStackXt
      - uses: actions/upload-artifact@v4
        with:
          name: TeoStackXt-installer
          path: |
            dist/*.pkg
            dist/*.dmg
          if-no-files-found: error
      - name: Pubblica release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.dmg dist/*.pkg \
            --title "TeoStackXt ${{ github.ref_name }}" \
            --notes "App macOS universale (Intel + Apple Silicon). .dmg: versione portatile (trascina TeoStackXt.app dove vuoi). .pkg: installer. Primo avvio: clic destro sull'app, poi Apri."
